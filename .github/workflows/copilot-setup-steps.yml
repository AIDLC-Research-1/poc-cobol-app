# Pre-installs GnuCOBOL if available; build/test remain manual-gate otherwise.
name: "Copilot Setup Steps"

on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attempt GnuCOBOL install (manual-gate if unavailable)
        run: |
          sudo apt-get update && sudo apt-get install -y gnucobol4 || echo "GnuCOBOL unavailable: manual-gate"
